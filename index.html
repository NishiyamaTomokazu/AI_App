<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>New App</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="main-body">
    <!-- 上部のタブ。ボタンは下の PAGES から自動で作られます -->
    <nav class="tabs" id="tabs"></nav>
    <iframe id="content-frame" title="content" allow="microphone"></iframe>

    <script type="module">
        import { comm } from './js/comm.js';
        window.comm = comm;     // 各ページから window.parent.comm で使う

        // ==========================================
        // タブの一覧。ページを増やすときはここに1行足すだけ
        // ==========================================
        const PAGES = [
            { url: 'pages/step0.html', label: 'STEP0', sub: '導入' },
            { url: 'pages/step1.html', label: 'STEP1', sub: '光を作ろう' },
            { url: 'pages/step2.html', label: 'STEP2', sub: '腕試し' },
            // STEP2をクリア(または3回失敗)するまでは隠しておくタブ。id指定で後から表示する。
            { url: 'pages/step3.html', label: 'STEP3', sub: '解説', id: 'tab-step3', hidden: true },
            // STEP3のボタンを押すと、STEP4〜STEP9のタブが一括で表示される。
            { url: 'pages/step4.html', label: 'STEP4', sub: '順次処理', id: 'tab-step4', hidden: true },
            // ★中身は仮の準備中ページ。本番ができたら pages/stepN.html を差し替える
            { url: 'pages/step5.html', label: 'STEP5', sub: '音センサ', id: 'tab-step5', hidden: true },
            { url: 'pages/step6.html', label: 'STEP6', sub: 'スイッチ', id: 'tab-step6', hidden: true },
            { url: 'pages/step7.html', label: 'STEP7', sub: '分岐処理', id: 'tab-step7', hidden: true },
            { url: 'pages/step8.html', label: 'STEP8', sub: '反復処理', id: 'tab-step8', hidden: true },
            { url: 'pages/step9.html', label: 'STEP9', sub: '総合', id: 'tab-step9', hidden: true },
            // ↓ 動作確認用 (通信テスト)。不要になったら削除してOK
            { url: 'pages/page1.html', label: 'PAGE1', sub: '接続・送信' },
            { url: 'pages/page2.html', label: 'PAGE2', sub: '受信モニタ' },
            { url: 'pages/page3.html', label: 'PAGE3', sub: '新しいページ' },
        ];

        const tabsEl = document.getElementById('tabs');
        const frame = document.getElementById('content-frame');
        const buttons = PAGES.map((p, i) => {
            const b = document.createElement('button');
            b.className = 'tab-btn';
            if (p.id) b.id = p.id;
            if (p.hidden) b.style.display = 'none';
            b.innerHTML = `${p.label}<br>${p.sub}`;
            b.addEventListener('click', () => showPage(i));
            tabsEl.appendChild(b);
            return b;
        });

        // 隠しタブを表示する (例: window.parent.unlockTab('tab-step3'))
        window.unlockTab = function(id) {
            const el = document.getElementById(id);
            if (el) el.style.display = 'inline-block';
        };

        function showPage(i) {
            buttons.forEach((b, k) => b.classList.toggle('active', k === i));
            frame.src = PAGES[i].url;
            history.replaceState(null, '', '#' + i);   // 再読み込みしても同じタブに戻る
        }

        // ページ側から他のタブへ移動したいとき: window.parent.showPage(1)
        window.showPage = showPage;

        // ==========================================
        // 受信データ・状態を、表示中のページへ通知する
        // ==========================================
        function forward(type, detail) {
            const w = frame.contentWindow;
            if (!w) return;
            try { w.dispatchEvent(new w.CustomEvent(type, { detail })); } catch (e) { /* ページ読み込み中 */ }
        }
        comm.addEventListener('byte',       (e) => forward('comm-byte', e.detail));
        comm.addEventListener('frameError', (e) => forward('comm-frame-error', e.detail));
        comm.addEventListener('status',     (e) => forward('comm-status', e.detail));
        comm.addEventListener('tone',       (e) => forward('comm-tone', e.detail));

        // 常にSTEP0(先頭のタブ)から開く
        showPage(0);
    </script>
</body>
</html>
