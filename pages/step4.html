<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LED Control App - STEP4</title>
<link rel="stylesheet" href="../css/style.css">
<!-- Blocklyのライブラリ -->
<script src="https://unpkg.com/blockly/blockly.min.js"></script>
</head>
<body class="iframe-body">

<div class="top-controls step4">
    <button class="connect-btn" id="connect-btn">🪄 AI クロックに接続</button>
    <span class="connect-hint" id="connect-hint">← まずはここを押そう！</span>
</div>

<div class="app-container step4">
    <div class="panel-header">
        <h2>💻 プログラミングラボ</h2>
        <p>ブロックをつなげて、光の魔法を自動化しよう！</p>
    </div>

    <div class="content-wrapper">
        <!-- 左側：手動パネル (操作不可。Blocklyの実行に合わせて色だけ変わる) -->
        <div class="left-panel">
            <div class="led-container"><div class="led" id="led-image"></div></div>
            <div class="controls">
                <div class="color-col">
                    <span class="color-label">🔴 赤</span>
                    <button class="btn on-btn" id="red-on">ON</button>
                    <button class="btn off-btn" id="red-off">OFF</button>
                </div>
                <div class="color-col">
                    <span class="color-label">🟢 緑</span>
                    <button class="btn on-btn" id="green-on">ON</button>
                    <button class="btn off-btn" id="green-off">OFF</button>
                </div>
                <div class="color-col">
                    <span class="color-label">🔵 青</span>
                    <button class="btn on-btn" id="blue-on">ON</button>
                    <button class="btn off-btn" id="blue-off">OFF</button>
                </div>
            </div>
            <div class="end-container"><button class="btn" id="end-btn">リセット</button></div>
            <!-- 「現在の変数(appState)」の表示は削除。接続状態のみ表示 -->
            <div class="state-display">
                [ <span id="device-status">未接続</span> ]
            </div>
        </div>

        <!-- 右側：プログラミングパネル -->
        <div class="right-panel" style="justify-content: flex-start;">

            <button class="start-btn" id="transfer-btn" style="width: 100%; font-size: 18px; padding: 10px; margin-bottom: 10px; background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);">
                🚀 プログラム転送
            </button>
            <button class="start-btn" id="run-btn" style="width: 100%; font-size: 18px; padding: 10px; margin-bottom: 15px; background: linear-gradient(135deg, #f6d365 0%, #fda085 100%); color: #333;">
                ▶️ プログラム実行
            </button>

            <xml id="toolbox" style="display: none">
                <block type="cmd_led">
                    <field name="COLOR">red</field>
                    <field name="TIME">1</field>
                </block>
            </xml>

            <div id="blocklyDiv" style="height: 450px; width: 100%; border: 2px solid #ccc; border-radius: 8px;"></div>
        </div>
    </div>
</div>

<script src="../js/blockly_config.js"></script>
<script src="../js/step4.js"></script>
</body>
</html>
